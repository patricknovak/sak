name: Deploy to Cloudflare

# The app and the landing page on Cloudflare (docs/EXPANSION.md B5, hosting): the app as a Worker serving dist/, the
# landing page as a Worker serving landing/. Both deploy on every push to main once the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets exist; until then every run says so and stops, green. GitHub Pages keeps serving SaK
# (deploy.yml) until the move's step 3.

on:
  push:
    branches: [main]
    paths-ignore: ['supabase/**', 'data/**', 'scripts/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "::notice::Cloudflare secrets not set yet; nothing deployed."; fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
      - if: steps.ready.outputs.go == 'true'
        run: npm run build
      - name: Deploy the app
        if: steps.ready.outputs.go == 'true'
        run: npx -y wrangler@4 deploy
      - name: Deploy the landing page
        if: steps.ready.outputs.go == 'true'
        run: npx -y wrangler@4 deploy --config landing/wrangler.jsonc
