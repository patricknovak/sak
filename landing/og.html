<!doctype html>
<!-- The share card. Render to og.png with the headless Chromium (see README.md); 1200 x 630. -->
<html lang="en"><head><meta charset="utf-8" />
<style>
  @font-face { font-family: 'Barlow Condensed'; font-style: italic; font-weight: 900; src: url(./fonts/barlow-condensed-900-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 900; src: url(./fonts/barlow-condensed-900.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 700; src: url(./fonts/barlow-condensed-700.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 400 600; src: url(./fonts/inter.woff2) format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(900px 520px at 6% -10%, rgba(56,189,248,.24), transparent 60%), radial-gradient(800px 460px at 100% 0%, rgba(247,197,72,.18), transparent 55%), #0b1220; color: #eef2ff; font-family: Inter, sans-serif; display: flex; align-items: center; padding: 0 84px; box-sizing: border-box; gap: 56px; }
  .mark { width: 220px; height: 220px; flex: none; filter: drop-shadow(0 24px 40px rgba(0,0,0,.5)); }
  .word { font-family: 'Barlow Condensed'; font-weight: 900; font-size: 128px; line-height: .9; letter-spacing: .01em; }
  .word b { color: #f7c548; font-style: italic; font-weight: 900; }
  .tag { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 28px; letter-spacing: .22em; text-transform: uppercase; color: #38bdf8; margin-top: 18px; }
  .sub { font-size: 24px; color: #cbd5e1; margin-top: 22px; max-width: 760px; line-height: 1.4; }
  .foot { position: absolute; left: 84px; bottom: 44px; font-size: 20px; color: #94a3b8; }
</style></head>
<body>
  <svg class="mark" viewBox="0 0 64 64"><defs><radialGradient id="bg" cx="50%" cy="20%" r="90%"><stop offset="0" stop-color="#1b2a55"/><stop offset=".55" stop-color="#0b1220"/><stop offset="1" stop-color="#04070f"/></radialGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#f7c548"/><stop offset="1" stop-color="#c58d0e"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#bg)"/><rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#fff" stroke-opacity=".1"/><circle cx="32" cy="32" r="20" fill="none" stroke="#38bdf8" stroke-opacity=".18" stroke-width="1"/><circle cx="32" cy="32" r="17" fill="none" stroke="url(#gold)" stroke-width="4"/><circle cx="32" cy="32" r="4.5" fill="url(#gold)"/><g stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round"><line x1="25" y1="8" x2="25" y2="12.5"/><line x1="39" y1="8" x2="39" y2="12.5"/><line x1="25" y1="51.5" x2="25" y2="56"/><line x1="39" y1="51.5" x2="39" y2="56"/></g></svg>
  <div>
    <div class="word"><b>SUPER</b> POOLS</div>
    <div class="tag">Fantasy pools from the future</div>
    <div class="sub">Fun fantasy pools with friends, for all. AI-enhanced lineups, recaps and trade grades, live scoring from the box scores and side bets in coins. Fun for all, never money.</div>
  </div>
  <div class="foot">superpoolsai.com · built by a hockey pool since 2013 · NHL 2026-27 · private beta</div>
</body></html>
