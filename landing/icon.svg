<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Super Pools: the faceoff dot. Where every game starts and where every player locks (his own puck drop). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="90%"><stop offset="0" stop-color="#1b2a55"/><stop offset=".55" stop-color="#0b1220"/><stop offset="1" stop-color="#04070f"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#f7c548"/><stop offset="1" stop-color="#c58d0e"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#38bdf8" stroke-opacity=".18" stroke-width="1"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="32" cy="32" r="4.5" fill="url(#gold)"/>
  <g stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round">
    <line x1="25" y1="8" x2="25" y2="12.5"/><line x1="39" y1="8" x2="39" y2="12.5"/>
    <line x1="25" y1="51.5" x2="25" y2="56"/><line x1="39" y1="51.5" x2="39" y2="56"/>
  </g>
</svg>
