<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="22%" r="85%">
      <stop offset="0" stop-color="#1b2a55"/><stop offset=".5" stop-color="#0c1530"/><stop offset="1" stop-color="#04070f"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/><stop offset=".45" stop-color="#f7c548"/><stop offset="1" stop-color="#b8800a"/>
    </linearGradient>
    <linearGradient id="goldTxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d6"/><stop offset=".55" stop-color="#f7c548"/><stop offset="1" stop-color="#d59a12"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd7ff"/><stop offset="1" stop-color="#2fb2f2"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c7e6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="4"/>
  <!-- rink markings -->
  <g fill="none" stroke="#4cc3ff" stroke-opacity=".10" stroke-width="6">
    <line x1="0" y1="256" x2="512" y2="256" stroke="#ef2a4f" stroke-opacity=".16"/>
    <circle cx="256" cy="256" r="230"/>
  </g>
  <!-- gold championship ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#f7c548" stroke-opacity=".45" stroke-width="34" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#goldRing)" stroke-width="22"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <!-- stars on the ring -->
  <g fill="url(#silver)">
    <path d="M256 44l7.5 15.5L280 62l-12 11.7 2.8 16.8L256 82.6l-14.8 7.9 2.8-16.8L232 62l16.5-2.5z"/>
    <path d="M256 424l7.5 15.5L280 442l-12 11.7 2.8 16.8L256 462.6l-14.8 7.9 2.8-16.8L232 442l16.5-2.5z"/>
  </g>
  <!-- wordmark -->
  <text x="256" y="278" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="150" letter-spacing="-6" fill="#000" fill-opacity=".5" filter="url(#soft)" transform="translate(0 6)">SAK</text>
  <text x="256" y="278" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="150" letter-spacing="-6" fill="url(#goldTxt)">SAK</text>
  <!-- banner -->
  <path d="M120 306h272l14 20-14 20H120l-14-20z" fill="#0b1222" stroke="url(#ice)" stroke-width="3"/>
  <text x="256" y="335" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="24" letter-spacing="6" fill="url(#silver)">SUPERLEAGUE</text>
  <text x="256" y="170" text-anchor="middle" font-size="34">☘️</text>
</svg>
